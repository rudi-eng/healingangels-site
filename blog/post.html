<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="../index.html">
      <span class="brand-mark"><svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" width="38" height="38" aria-hidden="true"><path d="M16 4 C 11 4 7 8 7 14 c 0 6 4 14 9 14 s 9-8 9-14 c 0-6-4-10-9-10 z M 11 9 l 1.5 2.5 M 21 9 l -1.5 2.5" stroke="#C9A6A0" stroke-width="1.6" fill="#FBEFD6"/><circle cx="13" cy="13" r="1" fill="#A9807A"/><circle cx="19" cy="13" r="1" fill="#A9807A"/></svg></span>
      <span><span class="brand-name">Healing Angels</span><br><span class="brand-tag">Prayer · Cats · Healing</span></span>
    </a>

    <nav class="nav">
      <a href="../index.html" data-nav="home">Home</a>

</header>

<main id="main">
<section style="padding: 56px 0 24px;">
  <div class="container">
    <article class="post-single" id="post">
      <a class="back-link" href="../blog.html">← Back to journal</a>
      <p class="muted">Loading the post…</p>
    </article>
  </div>
</section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>&copy; <span data-year>2026</span> <span>Healing Angels · Friends of Caycuma</span></span>
      <span class="faint">made with quiet prayers</span>
    </div>
  </div>
</footer>

<script src="../assets/js/app.js"></script>
<script>
function loadPost() {
  const id = new URLSearchParams(location.search).get("id");
  const post = document.getElementById("post");
  const back = "← Back to journal";
  if (!id) {
    post.innerHTML = '<a class="back-link" href="../blog.html">' + HA.esc(back) + '</a><p class="empty">' + HA.esc("No post was specified.") + '</p>';
    return;
  }
  HA.api.post(id).then(p => {
    if (!p || !p.id) {
      post.innerHTML = '<a class="back-link" href="../blog.html">' + HA.esc(back) + '</a><p class="empty">' + HA.esc("This post could not be found.") + '</p>';
      return;
    }
    const cover = p.cover_url
      ? `<div class="post-cover"><img src="${HA.esc(p.cover_url)}" alt="${HA.esc(p.title)}"></div>`
      : (p.cover_url === "" ? "" : `<div class="post-cover placeholder">${HA.placeholderSVG(7, p.title)}</div>`);
    post.innerHTML = `
      <a class="back-link" href="../blog.html">${HA.esc(back)}</a>
      ${cover}
      <h1>${HA.esc(p.title)}</h1>
      <div class="post-meta">${p.published_at ? HA.fmtDate(p.published_at) : ""}</div>
      <div class="post-body">${HA.mdToHtml(p.body_md || "")}</div>
    `;
    document.title = (p.title || "Post") + " — Healing Angels";
  }).catch(e => {
    post.innerHTML = '<a class="back-link" href="../blog.html">' + HA.esc(back) + '</a><p class="empty">' + HA.esc("This post could not be loaded.") + " " + HA.esc(e.message) + '</p>';
  });
}

loadPost();
</script>
</body>
</html>
