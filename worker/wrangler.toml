# Healing Angels API — Cloudflare Worker (Python)
# Deploy from this folder:  cd worker  &&  npx wrangler deploy
# (or: uv run pywrangler deploy)

name = "healingangels-api"
main = "src/main.py"
compatibility_date = "2026-08-11"
compatibility_flags = ["python_workers"]

# D1 database
# Create:  npx wrangler d1 create healingangels
# Then paste the real database_id UUID below (do not leave a placeholder).
[[d1_databases]]
binding = "DB"
database_name = "healingangels"
database_id = "00000000-0000-0000-0000-000000000000"

# R2 photo bucket
# Create:  npx wrangler r2 bucket create healing-photos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "healing-photos"

# Secrets (never commit real values). Set with:
#   npx wrangler secret put ADMIN_USERNAME
#   npx wrangler secret put ADMIN_PASSWORD_HASH
#   npx wrangler secret put SESSION_SECRET

[vars]
CORS_ORIGIN = "https://healingangels.pages.dev"
